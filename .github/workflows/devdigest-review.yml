# Generated by DevDigest. Re-export the agent to regenerate — do not edit by hand.
name: DevDigest Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Skip forked pull request
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "DevDigest review skipped: this pull request comes from a fork and cannot access repository secrets."

      - name: Run DevDigest review
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVDIGEST_POST_AS: pr_comment

      - name: Upload review result
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devdigest-result
          path: devdigest-result.json
